[workspace]
resolver = "3"
members = ["crates/uwm-core", "crates/uwm-cli", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
uwm-core = { path = "crates/uwm-core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
toml = "1"
nusb = "0.2.8"
futures-lite = "2"
which = "8"
dirs = "7"
tracing = "0.1"
lofty = "0.25.4"
walkdir = "2.5"
encoding_rs = "0.8"
libc = "0.2"
md-5 = "0.10"
sha2 = "0.10"
flate2 = "1"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2"] }
ureq = { version = "3.4", default-features = false, features = ["rustls", "gzip", "json"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = "debuginfo"
